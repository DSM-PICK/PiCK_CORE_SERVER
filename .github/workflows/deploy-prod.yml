name: Deploy Prod

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-prod
    cancel-in-progress: false

env:
    REGISTRY: docker.io
    IMAGE_REPOSITORY: sungjujjang/pick-core-prod
    GITOPS_REPO: DSM-PICK/PICK-INFRA-APPLICATION
    GITOPS_VALUES_FILE: apps/prod/values.yaml
    DEPLOYMENT_NAME: pick-core-prod

jobs:
    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: sungjujjang
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
                      ${{ env.IMAGE_REPOSITORY }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Checkout GitOps repository
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.GITOPS_REPO }}
                  ref: main
                  token: ${{ secrets.GITOPS_PAT }}
                  path: gitops
                  fetch-depth: 0

            - name: Install yq
              run: |
                  sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
                  sudo chmod +x /usr/local/bin/yq

            - name: Update image in GitOps manifest
              env:
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  if [ ! -f "gitops/${GITOPS_VALUES_FILE}" ]; then
                    echo "::error::GitOps manifest not found: ${GITOPS_VALUES_FILE}"
                    exit 1
                  fi

                  if ! yq -e ".deployments[] | select(.name == \"${DEPLOYMENT_NAME}\")" "gitops/${GITOPS_VALUES_FILE}" > /dev/null; then
                    echo "::error::Deployment '${DEPLOYMENT_NAME}' not found in ${GITOPS_VALUES_FILE}"
                    exit 1
                  fi

                  yq -i "(.deployments[] | select(.name == \"${DEPLOYMENT_NAME}\") | .image.repository) = strenv(IMAGE_REPOSITORY)" "gitops/${GITOPS_VALUES_FILE}"
                  yq -i "(.deployments[] | select(.name == \"${DEPLOYMENT_NAME}\") | .image.tag) = strenv(IMAGE_TAG)" "gitops/${GITOPS_VALUES_FILE}"

            - name: Commit and push GitOps manifest
              env:
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  git -C gitops config user.name "github-actions[bot]"
                  git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  if git -C gitops diff --quiet -- "${GITOPS_VALUES_FILE}"; then
                    echo "No changes to commit."
                    exit 0
                  fi

                  git -C gitops add "${GITOPS_VALUES_FILE}"
                  git -C gitops commit -m "chore(prod): update ${DEPLOYMENT_NAME} image to ${IMAGE_TAG}"
                  git -C gitops fetch origin main
                  git -C gitops rebase origin/main
                  git -C gitops push origin HEAD:main
